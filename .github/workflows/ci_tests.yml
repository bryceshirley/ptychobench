name: CI Pipeline

# Trigger the workflow on pushes to main, or any pull request
on:
  push:
    branches: [ "main"]
  pull_request:
    branches: [ "main"]

jobs:
  test:
    name: Run Linter and Tests
    runs-on: ubuntu-latest
    
    # Run the tests across multiple Python versions to ensure compatibility
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      # 1. Grab the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Install the `uv` package manager
      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # 3. Setup the specific Python version for this matrix run
      - name: Setup Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # 4. Install the package and all dependencies (including dev groups)
      - name: Install dependencies
        run: uv sync --all-groups

      # 5. Run Ruff (via pre-commit) to enforce code style
      - name: Run Linter
        run: uv run pre-commit run --all-files

      # 6. Run the physics unit tests
      - name: Run Pytest
        run: uv run pytest
      
      # 7. Run the type checker
      - name: Run Type Checker
        run: uv run ty check .