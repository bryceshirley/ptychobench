# Project Information
site_name: Ptychobench Documentation
site_description: A 2D benchmarking suite for forward propagation operators in Ptychography.
site_author: Bryce Shirley

# Visual Theme
theme:
  name: material
  palette:
    scheme: slate # Gives a nice dark mode theme for students!
    primary: indigo
    accent: deep purple
  features:
    - navigation.tabs # Adds tabs to the top for a clean look
    - navigation.sections

# Add this to the bottom of mkdocs.yml
markdown_extensions:
  - pymdownx.arithmatex:
      generic: true
  # Mermaid diagrams. The custom fence hands a ```mermaid block through as a
  # <pre class="mermaid"> rather than a code block, which is the hook Material
  # looks for before it pulls in mermaid.js. Without this a diagram renders as
  # its own source text.
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra_javascript:
  - javascripts/mathjax.js
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Installation: installation.md
  - User Guides:
      - Getting Started: quick_start.md
      - Simulation Grid: simulation_grid.md
      - Samples Guide: samples_guide.md
      - Results Guide: results_guide.md
  - References:
      - Physics Simulation: physics_simulation.md
      - API Reference: api_reference.md
      - Technical Theory: technical.md