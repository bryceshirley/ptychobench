[project]
name = "ptychobench"
version = "0.1.0"
description = "A benchmark tool for ptychography propagation operators."
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "ruff>=0.15.18",
    "numba>=0.65.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "scikit-image>=0.25.2",
    "ipympl>=0.10.0",
    "h5py>=3.16.0",
    "torch>=2.12.1",
    "abtem>=1.0.8",
    "ase>=3.29.0",
]
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "pre-commit",
    "ruff"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ptychobench", "ptychobench_3d"]
