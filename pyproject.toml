[project]
name = "ptychobench"
version = "0.1.0"
description = "A benchmark tool for ptychography propagation operators."
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "ruff>=0.15.18",
    "numba>=0.65.1",
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
]
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "ipykernel",
    "pytest",
    "pre-commit",
    "ruff"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
